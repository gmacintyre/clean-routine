name: Build and deploy .NET Core application to Web App CleanRoutine20261029180254
on:
  push:
    branches:
    - main
permissions:
  id-token: write
  contents: read
env:
  AZURE_WEBAPP_NAME: CleanRoutine20261029180254
  AZURE_WEBAPP_PACKAGE_PATH: src\CleanRoutine\published
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 10.0.x
  WORKING_DIRECTORY: src\CleanRoutine
jobs:
  build:
    environment: CleanRoutine20261029180254_Env
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
    - name: Restore
      run: dotnet restore "${{ env.WORKING_DIRECTORY }}"
    - name: Build
      run: dotnet build "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-restore
    - name: Test
      run: dotnet test "${{ env.WORKING_DIRECTORY }}" --no-build
    - name: Publish
      run: dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-build --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"
    - name: Publish Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: webapp
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
  deploy:
    environment: CleanRoutine20261029180254_Env
    runs-on: windows-latest
    needs: build
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: webapp
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
    - name: Check Azure sign-in settings
      shell: bash
      env:
        V_CLIENT: ${{ vars.CleanRoutine20261029180254_CLIENT_ID_EC6B }}
        V_TENANT: ${{ vars.CleanRoutine20261029180254_TENANT_ID_EC6B }}
        V_SUB: ${{ vars.CleanRoutine20261029180254_SUBSCRIPTION_ID_EC6B }}
        S_CLIENT: ${{ secrets.CleanRoutine20261029180254_CLIENT_ID_EC6B }}
        S_TENANT: ${{ secrets.CleanRoutine20261029180254_TENANT_ID_EC6B }}
        S_SUB: ${{ secrets.CleanRoutine20261029180254_SUBSCRIPTION_ID_EC6B }}
      run: |
        # Reports only whether each value exists, never the values themselves.
        state() { if [ -n "$1" ]; then echo set; else echo missing; fi; }
        echo "::notice::Variables - client: $(state "$V_CLIENT"), tenant: $(state "$V_TENANT"), subscription: $(state "$V_SUB")"
        echo "::notice::Secrets with the same names - client: $(state "$S_CLIENT"), tenant: $(state "$S_TENANT"), subscription: $(state "$S_SUB")"
        if [ -z "$V_CLIENT" ] || [ -z "$V_TENANT" ] || [ -z "$V_SUB" ]; then
          echo "::error::Azure sign-in values are missing. Add them as Variables (not Secrets) in Settings > Environments > CleanRoutine20261029180254_Env, using the exact names in this workflow."
          exit 1
        fi
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ vars.CleanRoutine20261029180254_CLIENT_ID_EC6B }}
        tenant-id: ${{ vars.CleanRoutine20261029180254_TENANT_ID_EC6B }}
        subscription-id: ${{ vars.CleanRoutine20261029180254_SUBSCRIPTION_ID_EC6B }}
    - name: Deploy to Azure WebApp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
